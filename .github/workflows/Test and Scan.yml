# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Test and Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  run_tests:
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        services: [tasks-api, title-normalizer] # ${{matrix.service}}
        python-version: ["3.10", "3.11", "3.12"] # ${{matrix.python-version}}


    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
            python-version: ${{matrix.python-version}}
      - run: pip install -r servies/${{matrix.service}}/requirements.txt
      - shell: bash
        run: pythest -rA services/${{matrix.service}} | tee ${{matrix.service}}-test-report.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{matrix.service}}-test-report
          path: ${{matrix.service}}-test-report.txt
      - run: pytest services/${{matrix.service}}
